name: CI

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

env:
  # Never let corepack block on its download confirmation prompt.
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Node 26 no longer bundles corepack; pin it so pnpm resolves from packageManager.
      - run: npm i -g corepack@0.35.0 && corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Node 26 no longer bundles corepack; pin it so pnpm resolves from packageManager.
      - run: npm i -g corepack@0.35.0 && corepack enable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:rules

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Node 26 no longer bundles corepack; pin it so pnpm resolves from packageManager.
      - run: npm i -g corepack@0.35.0 && corepack enable
      # pnpm audit reads pnpm-lock.yaml, so no install is needed.
      - run: pnpm audit --prod --audit-level moderate
